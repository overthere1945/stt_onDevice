# 파일명: gradle/libs.versions.toml
# 목적: 프로젝트 전체 의존성·플러그인 버전을 한 곳에서 고정하는 버전 카탈로그
# 기능: Compose 전환(Task 1)에 필요한 라이브러리/플러그인 버전 선언 (appcompat/material/constraintlayout 제거)

[versions]
agp = "9.4.1"
# change(add)-hyungchul-2026-10-10-11:56: Kotlin 버전 (compose·serialization 플러그인 공통, AGP 9 내장 Kotlin 사용이라 kotlin-android 플러그인은 쓰지 않음)
kotlin = "2.4.21"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
activityKtx = "1.13.0"
# change(add)-hyungchul-2026-10-10-11:56: Compose / Jetpack 계열 버전
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
# change(add)-hyungchul-2026-10-10-11:56: Kotlin 확장 라이브러리 버전
coroutines = "1.11.0"
serialization = "1.11.0"
# change(add)-hyungchul-2026-10-10-11:56: 엔진·유틸 라이브러리 버전 (네이티브 의존성은 해당 Task 에서 추가)
onnxruntime = "1.30.0"
vosk = "0.3.75"
jna = "5.18.1"
# commons-compress: Maven Central 최신 안정판(2026-10-10 조회)으로 고정
commonsCompress = "1.28.0"
# change(add)-hyungchul-2026-10-10-15:43: LiteRT(구 TensorFlow Lite) — Google Maven 최신 안정판(2026-10-10 조회, 2.3.0) 고정. Yamnet VAD 실행용
litert = "2.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
# change(add)-hyungchul-2026-10-10-11:56: Compose 라이브러리 (BOM 이 버전을 관리하므로 version 생략)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
# change(add)-hyungchul-2026-10-10-11:56: 코루틴·직렬화
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# change(add)-hyungchul-2026-10-10-11:56: JVM 단위 테스트용 ONNX Runtime (안드로이드용 onnxruntime-android 는 해당 Task 에서 추가)
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
# change(add)-hyungchul-2026-10-10-13:56: 앱(안드로이드) 런타임용 ONNX Runtime AAR (Task 12 ORT 기반 VAD). JVM 단위 테스트에서는 build.gradle.kts 에서 제외하고 onnxruntime-jvm 을 쓴다
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
# change(add)-hyungchul-2026-10-10-11:56: 이후 Task 에서 사용할 라이브러리 (카탈로그 선언만, 아직 의존성 미추가)
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
# change(add)-hyungchul-2026-10-10-15:43: Yamnet VAD 용 LiteRT 안드로이드 런타임(org.tensorflow.lite.Interpreter, arm64 libLiteRt.so·liblitert_jni.so 포함)
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# change(add)-hyungchul-2026-10-10-11:56: Compose 컴파일러 / 직렬화 플러그인 (둘 다 kotlin 버전)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
